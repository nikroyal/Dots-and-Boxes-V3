[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback so direct links to /match/abc, /profile/foo, etc. work
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Don't cache the HTML entry point. Without this, users who loaded the
# site once will keep hitting the old JS bundle until they hard-refresh
# — meaning any deploy is invisible to existing tabs until they Cmd-Shift-R.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Long-cache hashed assets. Vite emits filenames like main.a1b2c3d4.js where
# the hash changes on every content change, so this is safe and avoids
# re-downloading unchanged files on every visit.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Basic security headers — modest hardening for free.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
